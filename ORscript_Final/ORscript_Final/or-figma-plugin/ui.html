<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Inter, sans-serif; margin: 0; padding: 14px; background: #18181b; color: #f4f4f5; font-size: 12px; }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .badge { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .badge.connected { background: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.6); }
    .title { font-weight: 700; font-size: 13px; color: #fff; }
    .status { font-size: 11px; color: #a1a1aa; margin-bottom: 12px; }
    .btn { width: 100%; padding: 8px 12px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-export { margin-top: 8px; background: #059669; }
    .log-box { margin-top: 10px; padding: 8px; background: #09090b; border-radius: 6px; font-family: monospace; font-size: 10px; height: 85px; overflow-y: auto; color: #d4d4d8; }
  </style>
</head>
<body>
  <div class="header">
    <div id="dot" class="badge"></div>
    <div class="title">OR Figma Bridge</div>
  </div>
  <div id="status-text" class="status">Connecting to OR Agent on ws://127.0.0.1:9878...</div>
  <button id="reconnect-btn" class="btn">Reconnect Bridge</button>
  <button id="export-btn" class="btn btn-export">Export Selection to Studio</button>
  <div id="log" class="log-box">Ready.</div>
  <script>
    let ws = null;
    const dot = document.getElementById("dot"), statusText = document.getElementById("status-text"), logBox = document.getElementById("log");
    function log(m) { const d = document.createElement("div"); d.textContent = "[" + new Date().toLocaleTimeString() + "] " + m; logBox.appendChild(d); logBox.scrollTop = logBox.scrollHeight; }
    function connect() {
      try {
        log("Connecting ws://127.0.0.1:9878...");
        ws = new WebSocket("ws://127.0.0.1:9878");
        ws.onopen = () => { dot.className = "badge connected"; statusText.textContent = "Live connected (Port 9878)"; log("Bridge ready."); };
        ws.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            log("Received: " + (data.command || data.type));
            parent.postMessage({ pluginMessage: { type: "execute_cmd", payload: data } }, "*");
          } catch(err) { log("Parse err: " + err); }
        };
        ws.onclose = () => { dot.className = "badge"; statusText.textContent = "Disconnected."; log("Closed."); };
        ws.onerror = () => { dot.className = "badge"; statusText.textContent = "Port 9878 not responding."; };
      } catch(e) { log("Error: " + e); }
    }
    document.getElementById("reconnect-btn").onclick = () => connect();
    document.getElementById("export-btn").onclick = () => { parent.postMessage({ pluginMessage: { type: "export_selection" } }, "*"); };
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;
      if (msg.type === "cmd_result" && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg.result));
        log("Result sent: " + (msg.result.ok ? "OK" : "ERR"));
      }
    };
    connect();
  </script>
</body>
</html>
